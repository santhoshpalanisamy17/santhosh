<!DOCTYPE html>
<html>
<head>
<title>Student Registration Form</title>
</head>

<body>

<h1 align="center">Student Registration Form</h1>

<table border="0" cellpadding="8">

  <tr>
    <td><b>Roll no. :</b></td>
    <td><input type="text" name="roll_no"></td>
  </tr>

  <tr>
    <td><b>Student name :</b></td>
    <td>
      <input type="text" name="first_name" placeholder="First Name">
      -
      <input type="text" name="last_name" placeholder="Last Name">
    </td>
  </tr>

  <tr>
    <td><b>Father's name :</b></td>
    <td><input type="text" name="father_name"></td>
  </tr>

  <tr>
    <td><b>Date of birth :</b></td>
    <td>
      <select name="dob_day">
        <option>Day</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
      </select>

      <select name="dob_month">
        <option>Month</option>
        <option>January</option>
        <option>February</option>
        <option>March</option>
      </select>

      <select name="dob_year">
        <option>Year</option>
        <option>2005</option>
        <option>2006</option>
        <option>2007</option>
      </select>
      <i>(DD-MM-YYYY)</i>
    </td>
  </tr>

  <tr>
    <td><b>Mobile no. :</b></td>
    <td>
      <input type="text" name="country_code" value="+91" size="3">
      -
      <input type="text" name="mobile_no">
    </td>
  </tr>

  <tr>
    <td><b>Email id :</b></td>
    <td><input type="email" name="email"></td>
  </tr>

  <tr>
    <td><b>Password :</b></td>
    <td><input type="password" name="password"></td>
  </tr>

  <tr>
    <td><b>Gender :</b></td>
    <td>
      <input type="radio" name="gender" value="male"> Male
      <input type="radio" name="gender" value="female"> Female
    </td>
  </tr>

  <tr>
    <td><b>Department :</b></td>
    <td>
      <input type="checkbox" name="department" value="cse"> CSE
      <input type="checkbox" name="department" value="it"> IT
      <input type="checkbox" name="department" value="ece"> ECE
      <input type="checkbox" name="department" value="civil"> Civil
      <input type="checkbox" name="department" value="mech"> Mech
    </td>
  </tr>

  <tr>
    <td><b>Course :</b></td>
    <td>
      <select name="course">
        <option>------------------- Select Current Course's -------------------</option>
        <option>B.Tech</option>
        <option>M.Tech</option>
        <option>Diploma</option>
      </select>
    </td>
  </tr>

  <tr>
    <td><b>Student photo :</b></td>
    <td><input type="file" name="student_photo"></td>
  </tr>

  <tr>
    <td><b>City :</b></td>
    <td><input type="text" name="city"></td>
  </tr>

  <tr>
    <td valign="top"><b>Address :</b></td>
    <td><textarea rows="4" cols="30"></textarea></td>
  </tr>

</table>

</body>
</html>
    
</body>
</html>
